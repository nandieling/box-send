# 出包流水线：macOS 的 BoxSend.app 与 Windows 的安装包，同一套版本号（只改 Version.swift）
#
#   推 tag（仓库现在的 tag 形如 1.1）→ 两个平台的包直接挂到 GitHub Release
#   Actions 页面手动运行              → 只构建并留 artifact，不发版
#   提 PR / 推 main                   → 只跑测试
#
# Windows 那侧需要 Swift 工具链：runner 没预装，只能直连下载官方安装器
# （地址格式取自 swift.org/install/windows，目录名是 windows10、Windows 只有 .exe，没有 zip）。
# 换版本改下面 env 里的 SWIFT_WINDOWS；直连地址不对就把它填进 SWIFT_WINDOWS_URL。
name: 打包

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 打哪个平台
        type: choice
        default: both
        options: [both, macos, windows]

env:
  SWIFT_WINDOWS: "6.4.0"
  SWIFT_WINDOWS_URL: ""
  # 安装包校验值，抄自 winget 清单 microsoft/winget-pkgs 里 Swift.Toolchain 那一份；换版本记得一起改
  SWIFT_WINDOWS_SHA256: "76169A85BCBA82854A0CD8F9655FFB74B3758D60C35A245457510095F2823C03"
  # 核心库在 Windows 上还没跑过测试，先不让它挡住出包；跑绿之后改成 false
  ALLOW_WINDOWS_TEST_FAILURE: "true"

permissions:
  contents: write

jobs:
  macOS:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 测试
        run: |
          sw_vers
          swift --version
          # 先单独编译测试目标：编译错误与运行崩溃能一眼分开
          swift build --build-tests || { echo "!! 测试目标编译就没过"; exit 1; }
          swift test 2>&1 | grep -E "error:|Fatal error|failed|Executed .* tests" | tail -40
          # 过滤日志会让退出码变成 tail 的，这里取回 swift test 自己的
          exit "${PIPESTATUS[0]}"

      - name: 打包 .app
        run: |
          bash scripts/make-app.sh
          ditto -c -k --keepParent dist/BoxSend.app "BoxSend-$(sed -n 's/.*static let version = "\([^"]*\)".*/\1/p' Sources/BoxSendKit/Util/Version.swift | head -1)-macos.zip"

      - name: 留产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: BoxSend-*-macos.zip

      - name: 发版时传上 Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          file=$(ls BoxSend-*-macos.zip)
          gh release create "$tag" "$file" --title "BoxSend $tag" --notes "见 README 使用教程" 2>/dev/null ||
            gh release upload "$tag" "$file" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  Windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: 装 Swift 工具链
        timeout-minutes: 30
        shell: pwsh
        env:
          SWIFT_WINDOWS: ${{ env.SWIFT_WINDOWS }}
          SWIFT_WINDOWS_URL: ${{ env.SWIFT_WINDOWS_URL }}
          SWIFT_WINDOWS_SHA256: ${{ env.SWIFT_WINDOWS_SHA256 }}
        run: |
          $ErrorActionPreference = 'Continue'
          # 安装位置随安装器版本变，装完按目录扫出来再写进 PATH（Toolchains 与 Runtimes 都要）
          function Find-SwiftBins {
            $bins = @()
            $roots = @("$env:LOCALAPPDATA\Programs\Swift", 'C:\Library\Developer\Toolchains',
                       'C:\Program Files\Swift', 'C:\Swift') | Where-Object { Test-Path $_ }
            foreach ($r in $roots) {
              # 6.x 是分开的两份：Toolchains\<版本+Asserts>\usr\bin 与 Runtimes\<版本>\usr\bin
              foreach ($sub in 'Toolchains', 'Runtimes') {
                $bins += (Get-Item (Join-Path (Join-Path $r $sub) '*\usr\bin') -ErrorAction SilentlyContinue).FullName
              }
            }
            if (-not $bins) {   # 布局又变了就递归兜底
              foreach ($r in $roots) {
                $bins += Get-ChildItem $r -Recurse -Filter swiftCore.dll -ErrorAction SilentlyContinue |
                  ForEach-Object { $_.DirectoryName }
              }
            }
            return $bins | Where-Object { $_ } | Select-Object -Unique
          }
          if (Get-Command swift.exe -ErrorAction SilentlyContinue) {
            "runner 上已有 swift：" + (Get-Command swift.exe).Source
            exit 0
          }
          $v = $env:SWIFT_WINDOWS
          $url = if ($env:SWIFT_WINDOWS_URL) { $env:SWIFT_WINDOWS_URL } else {
            "https://download.swift.org/swift-$v-release/windows10/swift-$v-RELEASE/swift-$v-RELEASE-windows10.exe"
          }
          # Windows runner 是 Server 镜像，里面没有 winget，只能直连安装器（近 2GB）。
          # 用镜像自带的 curl：别用 Invoke-WebRequest，它先收完整响应再落盘、还要画进度条，
          # 两 GB 下来看着就跟卡死一样，还容易吃满内存。
          $exe = Join-Path $env:RUNNER_TEMP 'swift-installer.exe'
          "下载安装器（约 2GB）$url"
          foreach ($d in 'C', (($env:RUNNER_TEMP -split ':')[0])) {
            $g = Get-PSDrive $d -ErrorAction SilentlyContinue
            if ($g) { "盘 ${d}: 剩余 $([math]::Round($g.Free / 1GB, 1)) GB" }
          }
          $t = [Diagnostics.Stopwatch]::StartNew()
          & curl.exe --silent --show-error --fail --location --retry 3 --retry-delay 5 -o $exe $url
          if ($LASTEXITCODE -ne 0) { throw "下载失败，curl 退出码 $LASTEXITCODE" }
          "下载完成 $([math]::Round((Get-Item $exe).Length / 1MB)) MB，用时 $([int]$t.Elapsed.TotalSeconds) 秒"
          if ($env:SWIFT_WINDOWS_SHA256) {   # 两 GB 的包，先验一下再装
            $want = $env:SWIFT_WINDOWS_SHA256.Replace('-', '')
            $got = (Get-FileHash $exe -Algorithm SHA256).Hash
            if ($got -ne $want) { throw "安装包 SHA256 对不上（预期 $want，实际 $got），换个版本记得同步这里的值" }
            "SHA256 校验通过"
          }
          $t.Restart()
          # 官方安装器是 WiX Burn bundle（winget 清单里 InstallerType: burn），只认 burn 那套参数。
          # 传 Inno 的 /VERYSILENT 等于什么参数都没传，它会弹向导等人在界面上点，CI 上就是死等。
          # 清单里 Scope: user，装在 %LOCALAPPDATA% 下，不需要提权，不会有 UAC 弹窗卡住。
          $log = Join-Path $env:RUNNER_TEMP 'swift-burn.log'
          $p = Start-Process $exe -ArgumentList '/quiet', '/norestart', '/log', $log -PassThru
          if (-not $p.WaitForExit(1500000)) {   # 25 分钟硬闸，别让作业干等；日志留在下面这步之前打出来
            @($p) + @(Get-Process burn -ErrorAction SilentlyContinue) | ForEach-Object {
              try { $_.Kill() } catch {}
            }
            if (Test-Path $log) { "卡住时 burn 日志最后 40 行："; Get-Content $log -Tail 40 }
            throw "安装超过 25 分钟没结束"
          }
          $p.WaitForExit()
          # 退出码不当硬门禁（3010 是「装好了但要重启」），下面按找不找得到 swift 判定装没装上
          "安装器退出码 $($p.ExitCode)，用时 $([int]$t.Elapsed.TotalSeconds) 秒"
          $bins = Find-SwiftBins
          if (-not $bins) {
            "找不到，列一下可能的安装位置："
            Get-ChildItem 'C:\', 'C:\Program Files', "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'swift' } | ForEach-Object { $_.FullName }
            if (Test-Path $log) { "burn 日志最后 60 行："; Get-Content $log -Tail 60 }
            throw "装完了却没找到 swift.exe / swiftCore.dll：安装目录可能又变了"
          }
          $bins | ForEach-Object { "加进 PATH：" + $_; Add-Content -Path $env:GITHUB_PATH -Value $_ }
          # Windows 平台的 Swift 标准库不在工具链里，而在 …\Platforms\Windows.platform\Developer\SDK\Windows.sdk，
          # 安装器是靠写「用户环境变量 SDKROOT」把这条路告诉 swiftc 的（swift-installer-scripts 里
          # windows.wxs 的 <Environment Name="SDKROOT">）。runner 进程比安装动作早启动，读不到注册表里
          # 新写的值，编译就会报 unable to load standard library for target 'x86_64-unknown-windows-msvc'。
          # 本机开发不会遇到：装完重开一个终端就有值了。
          $sdk = [Environment]::GetEnvironmentVariable('SDKROOT', 'User')
          if (-not $sdk -or -not (Test-Path $sdk)) { $sdk = [Environment]::GetEnvironmentVariable('SDKROOT', 'Machine') }
          if (-not $sdk -or -not (Test-Path $sdk)) {   # 注册表那条没写成就按布局找
            $guess = Join-Path $env:LOCALAPPDATA 'Programs\Swift\Platforms\Windows.platform\Developer\SDK\Windows.sdk'
            $sdk = (Get-Item $guess -ErrorAction SilentlyContinue).FullName
          }
          if ($sdk) { "SDKROOT=$sdk（写进后续步骤环境）"; "SDKROOT=$sdk" | Add-Content -Path $env:GITHUB_ENV }
          else { "警告：没找到 Windows.platform 下的 Windows.sdk，编译可能仍说缺少标准库" }

      # PATH 是下一步才生效，所以 swift --version 与测试放到下一步里做
      - name: 测试
        shell: pwsh
        continue-on-error: ${{ env.ALLOW_WINDOWS_TEST_FAILURE == 'true' }}
        run: |
          swift --version
          swift build --build-tests
          if ($LASTEXITCODE -ne 0) { throw "!! 测试目标编译就没过（退出码 $LASTEXITCODE）" }
          swift test 2>&1 | Select-String -Pattern 'error:|Fatal error|failed|Executed .* tests' | Select-Object -Last 40
          if ($LASTEXITCODE -ne 0) { throw "swift test 没过（退出码 $LASTEXITCODE）" }

      - name: 装 Inno Setup（runner 已预装则跳过）
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                     "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
                     "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") |
                   Where-Object { Test-Path $_ }
          if ($found) { "已预装：" + $found[0]; exit 0 }
          & curl.exe --silent --show-error --fail --location --retry 3 -o "$env:RUNNER_TEMP\inno.exe" "https://jrsoftware.org/download.php/is.exe"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 下载失败，curl 退出码 $LASTEXITCODE" }
          Start-Process "$env:RUNNER_TEMP\inno.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Inno Setup 装完还是没找到 ISCC.exe" }

      - name: 打包安装包
        shell: pwsh
        run: .\windows\build.ps1 -Setup

      - name: 留产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: windows/installer/Output/*.exe

      - name: 发版时传上 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $exe = (Get-ChildItem windows/installer/Output -Filter *.exe | Select-Object -First 1).FullName
          $notes = "含 .NET 运行时，装完即用；用法见 README。"
          gh release create "$env:GITHUB_REF_NAME" "$exe" --title "BoxSend $env:GITHUB_REF_NAME" --notes $notes 2>$null
          if ($LASTEXITCODE -ne 0) { gh release upload "$env:GITHUB_REF_NAME" "$exe" --clobber }
        env:
          GH_TOKEN: ${{ github.token }}
